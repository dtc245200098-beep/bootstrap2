<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Trang iPhone</title>
    <!-- Nhúng Bootstrap để tự động làm đẹp giao diện -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- 1. TÊN SẢN PHẨM & NÚT BẤM (Căn giữa) -->
    <div class="text-center my-4">
        <h1 class="fw-bold">iPhone 15 Pro</h1>
        <p class="text-muted">Thiết kế Titanium - Chip A17 Pro</p>
        <button class="btn btn-primary">Mua ngay</button>
    </div>

    <!-- 2. HÌNH ẢNH SẢN PHẨM -->
    <div class="text-center my-4">
        <img src="https://picsum.photos/400/250" class="img-fluid rounded">
    </div>

    <!-- 3. CHIA 3 CỘT TÍNH NĂNG -->
    <div class="container my-4">
        <div class="row text-center">
            <div class="col-md-4 p-3 border">
                <h5>Chip A17 Pro</h5>
                <p class="text-muted mb-0">Xử lý cực nhanh</p>
            </div>
            <div class="col-md-4 p-3 border">
                <h5>Camera 48MP</h5>
                <p class="text-muted mb-0">Chụp ảnh nét căng</p>
            </div>
            <div class="col-md-4 p-3 border">
                <h5>Pin dùng cả ngày</h5>
                <p class="text-muted mb-0">Không lo hết pin</p>
            </div>
        </div>
    </div>

</body>
</html>
