<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-light">

<div class="container my-5">
    <div class="row bg-white rounded shadow align-items-center overflow-hidden">
        
        <!-- CỘT 1: CAROUSEL GIỚI THIỆU LỢI ÍCH -->
        <div class="col-md-6 p-0">
            <div id="benefitCarousel" class="carousel slide" data-bs-ride="carousel">
                <!-- Nút chuyển slide -->
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#benefitCarousel" data-bs-slide-to="0" class="active"></button>
                    <button type="button" data-bs-target="#benefitCarousel" data-bs-slide-to="1"></button>
                    <button type="button" data-bs-target="#benefitCarousel" data-bs-slide-to="2"></button>
                </div>

                <div class="carousel-inner">
                    <!-- Slide 1 -->
                    <div class="carousel-item active">
                        <img src="https://picsum.photos/600/500?random=10" class="d-block w-100" style="height: 480px; object-fit: cover;" alt="Lợi ích 1">
                        <div class="carousel-caption d-block bg-dark bg-opacity-50 rounded p-2">
                            <h5>Học Tập Mọi Lúc Mọi Nơi</h5>
                            <p class="small mb-0">Truy cập hàng ngàn bài giảng chất lượng cao.</p>
                        </div>
                    </div>
                    <!-- Slide 2 -->
                    <div class="carousel-item">
                        <img src="https://picsum.photos/600/500?random=20" class="d-block w-100" style="height: 480px; object-fit: cover;" alt="Lợi ích 2">
                        <div class="carousel-caption d-block bg-dark bg-opacity-50 rounded p-2">
                            <h5>Cộng Đồng Năng Động</h5>
                            <p class="small mb-0">Hỏi đáp và trao đổi cùng các chuyên gia.</p>
                        </div>
                    </div>
                    <!-- Slide 3 -->
                    <div class="carousel-item">
                        <img src="https://picsum.photos/600/500?random=30" class="d-block w-100" style="height: 480px; object-fit: cover;" alt="Lợi ích 3">
                        <div class="carousel-caption d-block bg-dark bg-opacity-50 rounded p-2">
                            <h5>Chứng Chỉ Phổ Biến</h5>
                            <p class="small mb-0">Nâng cao giá trị bản thân trong ngành IT.</p>
                        </div>
                    </div>
                </div>

                <!-- Nút bấm qua/lại -->
                <button class="carousel-control-prev" type="button" data-bs-target="#benefitCarousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#benefitCarousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>
            </div>
        </div>

        <!-- CỘT 2: FORM ĐĂNG KÝ -->
        <div class="col-md-6 p-4 p-lg-5">
            <h3 class="text-center text-primary mb-4 fw-bold">Tạo Tài Khoản</h3>
            
            <form>
                <!-- Họ tên -->
                <div class="mb-3">
                    <label for="fullName" class="form-label fw-semibold">Họ và tên</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user text-secondary"></i></span>
                        <input type="text" class="form-control" id="fullName" placeholder="Nguyễn Văn A" required>
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope text-secondary"></i></span>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    </div>
                </div>

                <!-- Mật khẩu -->
                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock text-secondary"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" required>
                    </div>
                </div>

                <!-- Xác nhận mật khẩu -->
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-check-double text-secondary"></i></span>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                    </div>
                </div>

                <!-- Điều khoản -->
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="terms" required>
                    <label class="form-check-label small" for="terms">Tôi đồng ý với các điều khoản dịch vụ</label>
                </div>

                <!-- Nút Đăng ký -->
                <button type="submit" class="btn btn-primary w-100 fw-bold">Đăng ký ngay</button>
            </form>
        </div>

    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
